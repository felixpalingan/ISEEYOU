name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-worker-check:
    name: Python Worker Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/worker-engine/requirements.txt

      - name: Smoke test FastAPI import
        run: |
          cd apps/worker-engine
          python -c "from engine.main import app; print('FastAPI loaded successfully')"

      - name: Run Python Unit Tests
        run: |
          cd apps/worker-engine
          python -m pytest -v

  frontend-types-and-build:
    name: Frontend & Types Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Build Next.js Web App
        run: npm run build --workspace=apps/web

  e2e-playwright:
    name: Playwright E2E Browser Testing
    runs-on: ubuntu-latest
    needs: [frontend-types-and-build, python-worker-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          npm ci || npm install
          pip install -r apps/worker-engine/requirements.txt

      - name: Build Shared Types & Next.js Web App
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=apps/web

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start FastAPI Worker Engine in Background
        run: |
          cd apps/worker-engine
          PYTHONPATH=. python -m uvicorn engine.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -s http://localhost:8000/api/v1/health || exit 1

      - name: Run Playwright E2E Tests
        run: npx playwright test --config apps/web/playwright.config.ts

      - name: Upload Playwright Test Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  docker-build-check:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-types-and-build, python-worker-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Worker Engine Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: iseeyou-worker:ci

      - name: Build Next.js Web App Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          push: false
          tags: iseeyou-web:ci
