name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Frontend & Types Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck Shared Types
        run: npm run build --workspace=packages/shared-types

      - name: Build Next.js Web App
        run: npm run build --workspace=apps/web

  python-worker-check:
    name: Python Worker Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/worker-engine/requirements.txt

      - name: Smoke test FastAPI import
        run: |
          cd apps/worker-engine
          python -c "from engine.main import app; print('FastAPI loaded successfully')"

      - name: Run Python Unit Tests
        run: |
          cd apps/worker-engine
          python -m pytest -v
